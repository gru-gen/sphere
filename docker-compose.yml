services:
  sphere.gateway:
    image: ${DOCKER_REGISTRY-}spheregateway
    build:
      context: .
      dockerfile: src/Sphere.Gateway/Dockerfile

  sphere.host:
    image: ${DOCKER_REGISTRY-}spherehost
    build:
      context: .
      dockerfile: src/Sphere.Host/Dockerfile

  sphere.catalog.service:
    image: ${DOCKER_REGISTRY-}spherecatalogservice
    build:
      context: .
      dockerfile: src/Sphere.Catalog.Service/Dockerfile

  sphere.basket.service:
    image: ${DOCKER_REGISTRY-}spherebasketservice
    build:
      context: .
      dockerfile: src/Sphere.Basket.Service/Dockerfile

  sphere.ordering.service:
    image: ${DOCKER_REGISTRY-}sphereorderingservice
    build:
      context: .
      dockerfile: src/Sphere.Ordering.Service/Dockerfile

  postgres:
    image: postgres:17.5-alpine

  kafka:
    image: apache/kafka:4.1.0

volumes:
  db-data:



