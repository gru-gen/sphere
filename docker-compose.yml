services:
  sphere.gateway:
    image: ${DOCKER_REGISTRY-}spheregateway
    build:
      context: .
      dockerfile: src/Sphere.Gateway/Dockerfile

  sphere.catalog.service:
    image: ${DOCKER_REGISTRY-}spherecatalogservice
    build:
      context: .
      dockerfile: src/Sphere.Catalog.Service/Dockerfile

  sphere.basket.service:
    image: ${DOCKER_REGISTRY-}spherebasketservice
    build:
      context: .
      dockerfile: src/Sphere.Basket.Service/Dockerfile

  sphere.ordering.service:
    image: ${DOCKER_REGISTRY-}sphereorderingservice
    build:
      context: .
      dockerfile: src/Sphere.Ordering.Service/Dockerfile

  sphere.notification.service:
    image: ${DOCKER_REGISTRY-}spherenotificationservice
    build:
      context: .
      dockerfile: src/Sphere.Notification.Service/Dockerfile

  postgres:
    image: postgres:17.5-alpine

  kafka:
    image: apache/kafka:4.1.0

  rabbitmq:
    image: rabbitmq:4.1-management

  apicurio:
    image: apicurio/apicurio-registry:3.0.14

  redis:
    image: redis:8.0-alpine

  keycloak:
    image: quay.io/keycloak/keycloak:26.3

volumes:
  db-data:
