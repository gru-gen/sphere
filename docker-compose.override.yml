services:
  sphere.gateway:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ReverseProxy__Clusters__catalog__Destinations__d1__Address=http://sphere.catalog.service:8080/
      - ReverseProxy__Clusters__ordering__Destinations__d1__Address=http://sphere.ordering.service:8080/
      - ReverseProxy__Clusters__basket__Destinations__d1__Address=http://sphere.basket.service:8080/
    ports:
      - "5100:8080"
    depends_on:
      - sphere.catalog.service
      - sphere.basket.service
      - sphere.ordering.service

  sphere.catalog.service:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__catalog=Host=postgres;Port=5432;Database=catalog_db;Username=sphere;Password=sphere-dev
    ports:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy

  sphere.basket.service:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__basket=Host=postgres;Port=5432;Database=basket_db;Username=sphere;Password=sphere-dev
      - Kafka__BootstrapServers=kafka:9092
      - Kafka__Source=/sphere/basket
    ports:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  sphere.ordering.service:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__ordering=Host=postgres;Port=5432;Database=ordering_db;Username=sphere;Password=sphere-dev
      - Catalog__BaseUrl=http://sphere.catalog.service:8080
      - Kafka__BootstrapServers=kafka:9092
      - Kafka__Source=/sphere/ordering
      - Rabbit__Host=rabbitmq
      - Rabbit__Port=5672
      - Rabbit__User=sphere
      - Rabbit__Pass=sphere-dev
    ports:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      sphere.catalog.service:
        condition: service_started
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  sphere.notification.service:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__notification=Host=postgres;Port=5432;Database=notification_db;Username=sphere;Password=sphere-dev
      - Rabbit__Host=rabbitmq
      - Rabbit__Port=5672
      - Rabbit__User=sphere
      - Rabbit__Pass=sphere-dev
      - Kafka__BootstrapServers=kafka:9092
    ports:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy

  postgres:
    environment:
      POSTGRES_USER: sphere
      POSTGRES_PASSWORD: sphere-dev
      POSTGRES_DB: sphere
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./tools/compose/init-catalog-db.sql:/docker-entrypoint-initdb.d/10-catalog-db.sql
      - ./tools/compose/init-basket-db.sql:/docker-entrypoint-initdb.d/20-basket-db.sql
      - ./tools/compose/init-ordering-db.sql:/docker-entrypoint-initdb.d/30-ordering-db.sql
      - ./tools/compose/init-notification-db.sql:/docker-entrypoint-initdb.d/40-notification-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sphere -d sphere"]
      interval: 2s
      timeout: 2s
      retries: 15
    ports:
      - "5433:5432"

  kafka:
   environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
   ports:
      - "9094:9094"
   healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  rabbitmq:
    environment:
      RABBITMQ_DEFAULT_USER: sphere
      RABBITMQ_DEFAULT_PASS: sphere-dev
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20

  apicurio:
    ports:
      - "8082:8080"

  redis:
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./tools/identity/sphere-realm.json:/opt/keycloak/data/import/sphere-realm.json:ro
    ports:
      - "8081:8080"
