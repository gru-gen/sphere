services:
  sphere.gateway:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ReverseProxy__Clusters__catalog__Destinations__d1__Address=http://sphere.catalog.service:8080/
      - ReverseProxy__Clusters__monolith__Destinations__d1__Address=http://sphere.host:8080/
    ports:
      - "5100:8080"
    depends_on:
      - sphere.host
      - sphere.catalog.service

  sphere.host:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__basket=Host=postgres;Port=5432;Database=sphere;Username=sphere;Password=sphere-dev
      - ConnectionStrings__ordering=Host=postgres;Port=5432;Database=sphere;Username=sphere;Password=sphere-dev
      - Catalog__BaseUrl=http://sphere.catalog.service:8080
      - Basket__BaseUrl=http://sphere.basket.service:8080
    ports:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      sphere.catalog.service:
        condition: service_started
      sphere.basket.service:
        condition: service_started

  sphere.catalog.service:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__catalog=Host=postgres;Port=5432;Database=catalog_db;Username=sphere;Password=sphere-dev
    ports:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy

  sphere.basket.service:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__basket=Host=postgres;Port=5432;Database=basket_db;Username=sphere;Password=sphere-dev
    ports:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    environment:
      POSTGRES_USER: sphere
      POSTGRES_PASSWORD: sphere-dev
      POSTGRES_DB: sphere
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./tools/compose/init-catalog-db.sql:/docker-entrypoint-initdb.d/10-catalog-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sphere -d sphere"]
      interval: 2s
      timeout: 2s
      retries: 15
    ports:
      - "5433:5432"
