services:

  sphere.gateway:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ReverseProxy__Clusters__catalog__Destinations__d1__Address=http://sphere.catalog.service:8080/
      - ReverseProxy__Clusters__basket__Destinations__d1__Address=http://sphere.basket.service:8080/
      - ReverseProxy__Clusters__monolith__Destinations__d1__Address=http://sphere.host:8080/
    ports:
      - "5100:8080"
    depends_on:
      - sphere.catalog.service
      - sphere.basket.service
      - sphere.host

  sphere.host:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__basket=Host=postgres;Port=5432;Database=sphere;Username=sphere;Password=sphere-dev
      - ConnectionStrings__ordering=Host=postgres;Port=5432;Database=sphere;Username=sphere;Password=sphere-dev
      - Catalog__BaseUrl=http://sphere.catalog.service:8080
      - Basket__BaseUrl=http://sphere.basket.service:8080
    ports:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      sphere.catalog.service:
        condition: service_started
      sphere.basket.service:
        condition: service_started

  sphere.catalog.service:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__catalog=Host=postgres;Port=5432;Database=catalog_db;Username=sphere;Password=sphere-dev
    ports:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy

  sphere.basket.service:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__basket=Host=postgres;Port=5432;Database=basket_db;Username=sphere;Password=sphere-dev
      - Kafka__BootstrapServers=kafka:9092
    ports:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  postgres:
    environment:
      POSTGRES_USER: sphere
      POSTGRES_PASSWORD: sphere-dev
      POSTGRES_DB: sphere
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./tools/compose/init-catalog-db.sql:/docker-entrypoint-initdb.d/10-catalog-db.sql
      - ./tools/compose/init-basket-db.sql:/docker-entrypoint-initdb.d/20-basket-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sphere -d sphere"]
      interval: 2s
      timeout: 2s
      retries: 15
    ports:
      - "5434:5432"

  pgadmin:
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - ./tools/ui/pgadmin-servers.json:/pgadmin4/servers.json:ro
      - ./tools/ui/pgpass:/pgadmin4/pgpass:ro
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "9094:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
